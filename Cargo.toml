[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
foton-core = { path = "crates/foton-core" }
foton-render = { path = "crates/foton-render" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
bytemuck = { version = "1.25.2", features = ["derive"] }
wgpu = { version = "30.0.1", default-features = false, features = ["webgpu", "webgl", "wgsl"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
