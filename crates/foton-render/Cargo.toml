[package]
name = "foton-render"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
foton-core.workspace = true
wgpu.workspace = true
bytemuck.workspace = true

# Native backends so the compositor can run headless in `cargo test`.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = { workspace = true, features = ["metal", "vulkan", "dx12"] }

[dev-dependencies]
pollster = "1.0.1"
